[package]
name = "bunker"
version = "0.3.0"
edition = "2021"
description = "Techno beats in orbit – a playful drum machine with bass, acid and an auto mode"
license = "MIT"
repository = "https://github.com/tj537/bunker"

[dependencies]
eframe = { version = "0.31", features = ["persistence"] }
egui-phosphor = "0.9"
serde = { version = "1", features = ["derive"] }
cpal = "0.16"
midir = "0.11"
rfd = "0.15"
ron = "0.8"

[dev-dependencies]
png = "0.17"

[build-dependencies]
# App icon and version info in the Windows .exe
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true

# The synth must be fast even in debug builds (cargo run / cargo test)
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1
