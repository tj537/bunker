    <rect width="100" height="100" rx="22" fill="#141417"/>
    <rect x="0.5" y="0.5" width="99" height="99" rx="21.5" fill="none" stroke="#2c2c33"/>
    <path d="M50 50 L50 16 A34 34 0 0 1 74.04 25.96 Z" fill="#c8ff3d" fill-opacity="0.18"/>
    <g fill="#6b6b74">
      <circle cx="63.0" cy="18.6" r="2"/><circle cx="74.0" cy="26.0" r="2"/><circle cx="81.4" cy="37.0" r="2"/>
      <circle cx="81.4" cy="63.0" r="2"/><circle cx="74.0" cy="74.0" r="2"/><circle cx="63.0" cy="81.4" r="2"/>
      <circle cx="37.0" cy="81.4" r="2"/><circle cx="26.0" cy="74.0" r="2"/><circle cx="18.6" cy="63.0" r="2"/>
      <circle cx="18.6" cy="37.0" r="2"/><circle cx="26.0" cy="26.0" r="2"/><circle cx="37.0" cy="18.6" r="2"/>
    </g>
    <g fill="#ecebe6">
