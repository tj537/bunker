name: Idea or feature request
description: Something that would make Solarum better, easier or more fun.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are very welcome! Solarum wants to stay easy and beautiful for everyone – kids, beginners and pros alike.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Solarum to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What were you trying to do? Who is it for – a beginner, a live performer, you?
  - type: textarea
    id: how
    attributes:
      label: How could it look or sound?
      description: Sketches, screenshots or examples from other apps are great. Optional.
  - type: checkboxes
    id: help
    attributes:
      label: Want to help build it?
      options:
        - label: I'd like to work on this myself
